<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDAG Bootcamp Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="assets/logo.png" alt="KDAG Logo" />
      <span>KDAG Ecosystem</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html" class="active btn-nav">Register Now</a>
    </nav>
  </header>

  <main class="form-container">
    <div class="form-card" id="formWrapper">
      <h2>Bootcamp Registration</h2>
      <p class="subtitle">Fill in your details to secure your slot.</p>
      
      <div id="errorMessage" class="error-box hidden"></div>

      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Ankit Kumar" />
        </div>

        <div class="form-group">
          <label for="rollNumber">Roll Number (e.g. 26IM10036)</label>
          <input type="text" id="rollNumber" placeholder="26IM10036" maxlength="9" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="ankit@example.com" />
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department">
            <option value="">Select your department</option>
            <option value="Industrial & Systems Engineering">Industrial & Systems Engineering</option>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Electronics & Electrical Communication">Electronics & Electrical Communication</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Other">Other Department</option>
          </select>
        </div>

        <button type="submit" class="btn-primary btn-full">Register</button>
      </form>
    </div>

    <div id="successPopup" class="success-card hidden">
      <div class="icon-check">✓</div>
      <h2>Registration Successful!</h2>
      <p>Welcome to the Bootcamp! We have logged your details.</p>
      <a href="index.html" class="btn-primary">Back to Home</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
